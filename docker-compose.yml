version: '3.8'

services:
  # ── MySQL Database ──
  db:
    image: mysql:8.0
    container_name: hr_monitoring_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hr_monitoring
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── App (Backend + Frontend Bundle + Socket.IO) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_monitoring_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: hr_monitoring
      JWT_SECRET: hr-monitoring-secret-key-production-2026
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"

volumes:
  mysql_data:
